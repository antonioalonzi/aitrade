[build-system]
requires = ["setuptools>=61.0.0"]
backend = "setuptools.build_meta"

[project]
name = "aitrade"
version = "0.1.0"
description = "AI Algorithmic Trading App for IG Index"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Antonio Alonzi" }
]
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "apscheduler>=3.10.4",
    "Jinja2>=3.1.6",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "protobuf==7.35.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "trading-ig>=0.0.25"

]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "freezegun==1.5.5"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
