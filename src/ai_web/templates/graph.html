{% extends "base.html" %}

{% block title %}Matrix Core - Ledger{% endblock %}

{% block content %}

    <div>
        <h2 style="float: left; margin: 0">
            <label for="epic-select" >Epic</label>
            <select id="epic-select" onchange="location.href='?epic=' + this.value +
                                                '{% if from %}&from={{ from }}{% endif %}' +
                                                '{% if to %}&to={{ to }}{% endif %}' +
                                                '{% if freq %}&freq={{ freq }}{% endif %}'">
                {% for current_epic in active_epics %}
                    <option value="{{ current_epic }}" {% if current_epic == epic %}selected{% endif %}>{{ current_epic }}</option>
                {% endfor %}
            </select>
        </h2>

        <div id="timeframe-links" style="float: right; display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 12px;">
            <a id="link-12h" href="#" class="link-button">12h (1m)</a>
            <a id="link-7d" href="#" class="link-button">7d (1h)</a>
            <a id="link-30d" href="#" class="link-button">30d (1d)</a>
        </div>
    </div>

    <div id="chart-container" style="height: calc(100vh - 400px); margin-bottom: 80px"></div>

    {% with trades=trades, title=None %}
        {% include "components/trades_table.html" %}
    {% endwith %}

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            function formatDateTime(date) {
                const pad = (n) => String(n).padStart(2, '0');

                const year = date.getUTCFullYear();
                const month = pad(date.getUTCMonth() + 1);
                const day = pad(date.getUTCDate());
                const hours = pad(date.getUTCHours());
                const minutes = pad(date.getUTCMinutes());
                const seconds = pad(date.getUTCSeconds());

                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            }

            async function httpGet(url) {
                try {
                    const response = await fetch(`{{ context_path }}${url}`);
                    return await response.json();
                } catch (error) {
                    console.error(`Failed to load ${url}:`, error);
                }
            }


            // variables from template context
            const epic = "{{ epic }}";
            const from = "{{ from }}";
            const to = "{{ to }}";
            const freq = "{{ freq }}";
            const tradeId = "{{ trade_id }}";
            const tradingDay = "{{ trading_day }}";



            const marketData = await httpGet(`/api/market-data?epic=${epic}&from=${from}&to=${to}&freq=${freq}`)

            let trades = [];
            if (tradeId !== "None") {
                const trade = await httpGet(`/api/trades?tradeId=${tradeId}`)
                trades = [trade]
            } else if (tradingDay !== "None") {
                trades = await httpGet(`/api/trades?tradingDay=${tradingDay}&epic=${epic}`);
            }

            const chartContainer = document.getElementById('chart-container');

            const tradeMarkers = trades.map(trade => {
                const tradeMarkers = [];
                if (trade && trade.opened_at) {
                    tradeMarkers.push({
                        time: trade.opened_at_timestamp,
                        position: 'belowBar',
                        shape: 'arrowUp',
                        color: '#00ff00',
                        text: `${trade.open_direction} @ ${trade.open_price}`
                    });
                }
                if (trade && trade.closed_at) {
                    tradeMarkers.push({
                        time: trade.closed_at_timestamp,
                        position: 'aboveBar',
                        shape: 'arrowDown',
                        color: '#ff0000',
                        text: `${trade.close_direction} @ ${trade.close_price}`
                    });
                }
                return tradeMarkers;
            }).flat();

            const tradeLineData = [];
                trades.toReversed().forEach(trade => {
                    if (trade && trade.opened_at && trade.closed_at) {
                        tradeLineData.push({
                            time: trade.opened_at_timestamp,
                            value: trade.open_price
                        });
                        tradeLineData.push({
                            time: trade.closed_at_timestamp,
                            value: trade.close_price
                        });
                    }
                });
            console.log(tradeLineData)



            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight,
                layout: {
                    background: { type: 'solid', color: '#151515' },
                    textColor: '#aaaaaa',
                },
                grid: {
                    vertLines: { color: '#333333' },
                    horzLines: { color: '#333333' },
                },
                timeScale: {
                    borderColor: '#444444',
                    timeVisible: true,
                },
                rightPriceScale: {
                    borderColor: '#444444',
                },
            });



            const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
                upColor: '#00ff00',
                downColor: '#ff0000',
                borderVisible: false,
                wickUpColor: '#00ff00',
                wickDownColor: '#ff0000',
            });
            candleSeries.setData(marketData);

            const tradeLineSeries = chart.addSeries(LightweightCharts.LineSeries, {
                    color: '#8888ff',
                    lineWidth: 5,
                    lineStyle: 0,
                    crosshairMarkerVisible: false
                });
            tradeLineSeries.setData(tradeLineData);


            LightweightCharts.createSeriesMarkers(candleSeries, tradeMarkers);




            chart.timeScale().fitContent();

            new ResizeObserver(entries => {
                const { width, height } = entries[0].contentRect;
                chart.resize(width, height);
            }).observe(chartContainer);

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: chartContainer.clientWidth });
            });



            // buttons
            const now = new Date();

            const from12h = formatDateTime(new Date(now.getTime() - (12 * 60 * 60 * 1000)));
            const from7d  = formatDateTime(new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000)));
            const from30d = formatDateTime(new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000)));

            document.getElementById('link-12h').href = `?epic=${epic}&from=${from12h}&freq=1min`;
            document.getElementById('link-7d').href  = `?epic=${epic}&from=${from7d}&freq=1h`;
            document.getElementById('link-30d').href = `?epic=${epic}&from=${from30d}&freq=1d`;
        });
    </script>

{% endblock %}
