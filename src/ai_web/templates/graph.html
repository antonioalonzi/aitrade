{% extends "base.html" %}

{% block title %}Matrix Core - Ledger{% endblock %}

{% block content %}

    <div>
        <h2 style="float: left; margin: 0">
            <label for="epic-select" >Epic</label>
            <select id="epic-select" onchange="location.href='?epic=' + this.value +
                                                '{% if from %}&from={{ from }}{% endif %}' +
                                                '{% if to %}&to={{ to }}{% endif %}' +
                                                '{% if freq %}&freq={{ freq }}{% endif %}'">
                {% for current_epic in active_epics %}
                    <option value="{{ current_epic }}" {% if current_epic == epic %}selected{% endif %}>{{ current_epic }}</option>
                {% endfor %}
            </select>
        </h2>

        <div id="timeframe-links" style="float: right; display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 12px;">
            <a id="link-12h" href="#" class="link-button">12h (1m)</a>
            <a id="link-7d" href="#" class="link-button">7d (1h)</a>
            <a id="link-30d" href="#" class="link-button">30d (1d)</a>
        </div>
    </div>

    <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 6px 0 0 100px;">
        <label style="color: #aaaaaa;">
            <input id="show-indicators" type="checkbox" checked>
            Show indicators
        </label>
        <div id="indicator-legend" style="display: flex; flex-wrap: wrap; gap: 12px;">
            <span style="color: #42a5f5">EMA 10</span>
            <span style="color: #ffb74d">EMA 30</span>
            <span style="color: #ce93d8">EMA 90</span>
            <span style="color: #26c6da">ATR 14</span>
            <span style="color: #66bb6a">ADX 14</span>
            <span style="color: #ef5350">RSI 14</span>
        </div>
    </div>
    <div id="chart-container" style="height: max(520px, calc(100vh - 400px)); margin-bottom: 80px"></div>

    {% with trades=trades, title=None %}
        {% include "components/trades_table.html" %}
    {% endwith %}

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const formatDateTime = (date) => {
                const pad = (n) => String(n).padStart(2, '0');

                const year = date.getUTCFullYear();
                const month = pad(date.getUTCMonth() + 1);
                const day = pad(date.getUTCDate());
                const hours = pad(date.getUTCHours());
                const minutes = pad(date.getUTCMinutes());
                const seconds = pad(date.getUTCSeconds());

                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            }

            const httpGet = async (url) => {
                try {
                    const response = await fetch(`{{ context_path }}${url}`);
                    return await response.json();
                } catch (error) {
                    console.error(`Failed to load ${url}:`, error);
                }
            };


            // variables from template context
            const epic = "{{ epic }}";
            const from = "{{ from }}";
            const to = "{{ to }}";
            const freq = "{{ freq }}";
            const tradeId = "{{ trade_id }}";
            const tradingDay = "{{ trading_day }}";


            // Fetch market data and trades
            const marketData = await httpGet(`/api/market-data?epic=${epic}&from=${from}&to=${to}&freq=${freq}`)
            const indicators = await httpGet(`/api/indicators?epic=${epic}&from=${from}&to=${to}&freq=${freq}`)

            let trades = [];
            if (tradeId !== "None") {
                const trade = await httpGet(`/api/trades?tradeId=${tradeId}`)
                trades = [trade]
            } else if (tradingDay !== "None") {
                trades = await httpGet(`/api/trades?tradingDay=${tradingDay}&epic=${epic}`);
            }



            // Create the chart
            const chartContainer = document.getElementById('chart-container');

            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: chartContainer.clientHeight,
                layout: {
                    background: { type: 'solid', color: '#151515' },
                    textColor: '#aaaaaa',
                },
                grid: {
                    vertLines: { color: '#333333' },
                    horzLines: { color: '#333333' },
                },
                timeScale: {
                    borderColor: '#444444',
                    timeVisible: true,
                },
                rightPriceScale: {
                    borderColor: '#444444',
                },
            });



            // candles
            const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
                upColor: '#00ff00',
                downColor: '#ff0000',
                borderVisible: false,
                wickUpColor: '#00ff00',
                wickDownColor: '#ff0000',
            });
            candleSeries.setData(marketData);

            // emas
            const createEmaSeries = (data, color) => {
                const series = chart.addSeries(LightweightCharts.LineSeries, {
                    color: color,
                    lineWidth: 2,
                    priceLineVisible: false,
                    lastValueVisible: false,
                });
                series.setData(data);
                return series;
            };

            const ema_fast_10 = createEmaSeries(indicators.emas.ema_fast_10, '#42a5f5');
            const ema_slow_30 = createEmaSeries(indicators.emas.ema_slow_30, '#ffb74d');
            const ema_trend_90 = createEmaSeries(indicators.emas.ema_trend_90, '#ce93d8');


            // indicators
            function addIndicatorPane(title, data, color) {
                const paneIndex = chart.panes().length;
                chart.addPane();
                const series = chart.addSeries(LightweightCharts.LineSeries, {
                    color: color,
                    lineWidth: 2,
                    priceLineVisible: false,
                    title: title,
                }, paneIndex);
                series.setData(data);
                return paneIndex;
            }

            const findPaneBySeriesTitle = (title) => {
                return chart.panes().find(pane =>
                    pane.getSeries().some(series => series.options().title === title)
                );
            }

            addIndicatorPane('ATR (14)', indicators.atr, '#26c6da');
            addIndicatorPane('ADX (14)', indicators.adx, '#66bb6a');
            addIndicatorPane('RSI (14)', indicators.rsi, '#ef5350');



            // resize chart
            const resizeChart = (width, height) => {
                chart.resize(width, height);
                const indicatorsVisible = document.getElementById('show-indicators').checked;
                const indicatorPaneHeight = indicatorsVisible ? Math.floor(height * 0.16) : 1;
                chart.panes().forEach((pane, index) => {
                    pane.setHeight(index === 0
                        ? height - indicatorPaneHeight * 3
                        : indicatorPaneHeight);
                });
            };
            resizeChart(chartContainer.clientWidth, chartContainer.clientHeight);



            // toggle indicators
            const indicatorToggle = document.getElementById('show-indicators');
            indicatorToggle.addEventListener('change', () => {
                ema_fast_10.applyOptions({ visible: indicatorToggle.checked });
                ema_slow_30.applyOptions({ visible: indicatorToggle.checked });
                ema_trend_90.applyOptions({ visible: indicatorToggle.checked });

                if (!indicatorToggle.checked) {
                    chart.removePane(findPaneBySeriesTitle('ATR (14)').paneIndex());
                    chart.removePane(findPaneBySeriesTitle('ADX (14)').paneIndex());
                    chart.removePane(findPaneBySeriesTitle('RSI (14)').paneIndex());
                } else {
                    addIndicatorPane('ATR (14)', indicators.atr, '#26c6da');
                    addIndicatorPane('ADX (14)', indicators.adx, '#66bb6a');
                    addIndicatorPane('RSI (14)', indicators.rsi, '#ef5350');
                }

                document.getElementById('indicator-legend').style.display = indicatorToggle.checked ? 'flex' : 'none';

                resizeChart(chartContainer.clientWidth, chartContainer.clientHeight);
            });



            // trades
            const tradeMarkers = trades.map(trade => {
                const tradeMarkers = [];
                if (trade && trade.opened_at) {
                    tradeMarkers.push({
                        time: trade.opened_at_timestamp,
                        position: 'belowBar',
                        shape: 'arrowUp',
                        color: '#00ff00',
                        text: `${trade.open_direction} @ ${trade.open_price}`
                    });
                }
                if (trade && trade.closed_at) {
                    tradeMarkers.push({
                        time: trade.closed_at_timestamp,
                        position: 'aboveBar',
                        shape: 'arrowDown',
                        color: '#ff0000',
                        text: `${trade.close_direction} @ ${trade.close_price}`
                    });
                }
                return tradeMarkers;
            }).flat();

            trades.forEach(trade => {
                if (trade && trade.opened_at && trade.closed_at) {
                    const pnl = trade.profit_or_loss ?? trade.calculated_profit_and_loss;
                    const tradeSeries = chart.addSeries(LightweightCharts.LineSeries, {
                        color: pnl >= 0 ? '#00ff00' : '#ff0000',
                        lineWidth: 5,
                        priceLineVisible: false,
                        lastValueVisible: false
                    });

                    tradeSeries.setData([
                        { time: trade.opened_at_timestamp, value: trade.open_price },
                        { time: trade.closed_at_timestamp, value: trade.close_price }
                    ]);
                }
            });



            // display
            LightweightCharts.createSeriesMarkers(candleSeries, tradeMarkers);



            // Fit the chart to the data
            chart.timeScale().fitContent();

            new ResizeObserver(entries => {
                const { width, height } = entries[0].contentRect;
                resizeChart(width, height);
            }).observe(chartContainer);

            window.addEventListener('resize', () => {
                resizeChart(chartContainer.clientWidth, chartContainer.clientHeight);
            });



            // range buttons
            const now = new Date();

            const from12h = formatDateTime(new Date(now.getTime() - (12 * 60 * 60 * 1000)));
            const from7d  = formatDateTime(new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000)));
            const from30d = formatDateTime(new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000)));

            document.getElementById('link-12h').href = `?epic=${epic}&from=${from12h}&freq=1min`;
            document.getElementById('link-7d').href  = `?epic=${epic}&from=${from7d}&freq=1h`;
            document.getElementById('link-30d').href = `?epic=${epic}&from=${from30d}&freq=1d`;
        });
    </script>

{% endblock %}
